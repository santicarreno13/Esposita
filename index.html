<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mientras llegas</title>
<meta name="description" content="Para Jessi.">
<meta name="theme-color" content="#120C1C">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght,SOFT@0,9..144,300..600,100;1,9..144,300..600,100&family=Karla:wght@300;400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --noche:#120C1C;
    --noche2:#1B1327;
    --carta:#231A33;
    --carta2:#2C2140;
    --borde:rgba(193,154,243,.16);
    --borde2:rgba(193,154,243,.38);
    --texto:#F1EAF9;
    --tenue:#AC9DC6;
    --tenue2:#7D6F94;
    --lirio:#C19AF3;
    --lirio2:#8F63CC;
    --oro:#E9CB8E;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%;background:var(--noche)}
  body{
    margin:0;
    background:
      radial-gradient(130% 80% at 50% -20%, #2B1D45 0%, var(--noche2) 42%, var(--noche) 100%)
      no-repeat, var(--noche);
    color:var(--texto);
    font-family:"Karla",system-ui,-apple-system,sans-serif;
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  #cielo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
  .wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 20px 60px}

  /* ---------- portada ---------- */
  .hero{padding:54px 0 0;text-align:center;animation:sube .7s ease both}
  @keyframes sube{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .fecha{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--tenue2);margin:0 0 22px}
  .lirio{width:54px;height:54px;margin:0 auto 14px;display:block;color:var(--lirio)}
  h1{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
    font-variation-settings:"SOFT" 100,"opsz" 144;
    font-size:clamp(46px,13vw,74px);line-height:.98;margin:0;letter-spacing:-.02em;
    color:var(--texto);text-wrap:balance}
  .para{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--lirio);margin:14px 0 0;opacity:.9}
  .saludo{color:var(--tenue);font-size:16px;margin:22px auto 0;max-width:36ch;
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;line-height:1.5}

  /* ---------- contador ---------- */
  .conteo{margin:34px 0 0;padding:28px 18px 24px;border:1px solid var(--borde);
    border-radius:18px;background:rgba(255,255,255,.028);position:relative;overflow:hidden}
  .conteo::before{content:"";position:absolute;inset:-40% -20% auto;height:70%;
    background:radial-gradient(50% 60% at 50% 50%, rgba(193,154,243,.10), transparent 70%);
    pointer-events:none}
  .anillo{position:relative;width:196px;height:196px;margin:0 auto}
  .anillo svg{width:100%;height:100%;display:block;transform:rotate(-90deg)}
  .anillo .pista{fill:none;stroke:rgba(193,154,243,.14);stroke-width:3}
  .anillo .avance{fill:none;stroke:var(--lirio);stroke-width:3;stroke-linecap:round;
    stroke-dasharray:1 1;transition:stroke-dashoffset 1.2s ease}
  .centro{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;
    justify-content:center}
  .centro b{font-family:"Fraunces",Georgia,serif;font-weight:300;font-style:normal;
    font-size:74px;line-height:1;color:var(--texto);font-variant-numeric:tabular-nums;
    letter-spacing:-.03em}
  .centro span{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.26em;
    text-transform:uppercase;color:var(--tenue2);margin-top:6px}
  .finos{display:flex;justify-content:center;gap:0;margin:20px auto 0;max-width:320px}
  .u{flex:1 1 0;min-width:0;text-align:center}
  .u b{display:block;font-family:"Space Mono",monospace;font-weight:700;font-size:22px;
    line-height:1;color:var(--lirio);font-variant-numeric:tabular-nums}
  .u span{display:block;font-family:"Space Mono",monospace;font-size:9px;letter-spacing:.17em;
    text-transform:uppercase;color:var(--tenue2);margin-top:7px}
  .u + .u{border-left:1px solid var(--borde)}
  .conteo p{margin:20px 0 0;font-size:14px;color:var(--tenue);text-align:center}
  .conteo p em{font-style:normal;color:var(--texto)}
  .llego{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
    font-size:54px;color:var(--oro);margin:0;text-align:center;line-height:1.1}

  /* ---------- separadores ---------- */
  .sep{display:flex;align-items:center;gap:14px;margin:50px 0 18px}
  .sep::before,.sep::after{content:"";flex:1;height:1px;background:var(--borde)}
  .sep h2{font-family:"Space Mono",monospace;font-size:10.5px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--tenue2);font-weight:400;margin:0;white-space:nowrap}

  /* ---------- cartas ---------- */
  .cartas{display:flex;flex-direction:column;gap:12px}
  .carta{border:1px solid var(--borde);border-radius:16px;background:var(--carta);
    overflow:hidden;transition:border-color .3s, background .3s, box-shadow .3s}
  .carta.abierta{border-color:var(--borde2);background:var(--carta2);
    box-shadow:0 10px 40px -20px rgba(193,154,243,.35)}
  .tapa{width:100%;background:none;border:0;color:inherit;font:inherit;cursor:pointer;
    text-align:left;padding:16px 16px 16px 14px;display:flex;align-items:center;gap:14px}
  .tapa:focus-visible{outline:2px solid var(--lirio);outline-offset:-3px;border-radius:16px}
  .sobre{flex:0 0 auto;width:46px;height:36px;display:block}
  .sobre .cuerpoS{fill:rgba(193,154,243,.10);stroke:var(--lirio);stroke-width:1.3}
  .sobre .solapa{fill:var(--carta);stroke:var(--lirio);stroke-width:1.3;
    transform-box:fill-box;transform-origin:50% 0;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .carta.abierta .sobre .solapa{transform:scaleY(-1) translateY(-1px)}
  .sobre .sello{fill:var(--lirio2);transition:opacity .3s}
  .carta.abierta .sobre .sello{opacity:0}
  .tapa .tt{flex:1;min-width:0}
  .tapa .k{font-family:"Space Mono",monospace;font-size:9.5px;letter-spacing:.17em;
    text-transform:uppercase;color:var(--tenue2);display:block;margin-bottom:3px}
  .tapa .q{font-family:"Fraunces",Georgia,serif;font-size:20px;font-weight:300;
    line-height:1.2;color:var(--texto);display:block}
  .flecha{flex:0 0 auto;width:11px;height:11px;border-right:1.5px solid var(--tenue);
    border-bottom:1.5px solid var(--tenue);transform:rotate(45deg);margin-right:6px;
    transition:transform .35s}
  .carta.abierta .flecha{transform:rotate(225deg)}

  .cuerpo{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s ease}
  .carta.abierta .cuerpo{grid-template-rows:1fr}
  .cuerpo > div{overflow:hidden}
  .texto{padding:4px 20px 22px}
  .texto p{margin:0 0 16px;font-size:16.5px;line-height:1.75;color:#E6DCF4}
  .texto p:first-child::first-letter{font-family:"Fraunces",Georgia,serif;font-style:italic;
    font-size:1.55em;line-height:1;color:var(--lirio);padding-right:1px}
  .texto p:last-child{margin-bottom:0}
  .versiculo{margin:6px 0 0;padding:16px 18px;border-left:2px solid var(--oro);
    background:rgba(233,203,142,.07);border-radius:0 10px 10px 0}
  .versiculo q{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
    font-size:17px;line-height:1.6;color:#F4E9D3;quotes:none}
  .versiculo cite{display:block;font-family:"Space Mono",monospace;font-style:normal;
    font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--oro);
    margin-top:10px;opacity:.85}

  .carta.cerrada{opacity:.6}
  .carta.cerrada .tapa{cursor:default}
  .carta.cerrada .sobre .cuerpoS,.carta.cerrada .sobre .solapa{stroke:var(--tenue2)}
  .carta.cerrada .sobre .sello{fill:var(--tenue2)}
  .carta.cerrada .q{color:var(--tenue)}
  .candado{font-family:"Space Mono",monospace;font-size:10px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--tenue2);white-space:nowrap}

  /* ---------- canciones ---------- */
  .cancion{display:flex;align-items:center;gap:14px;padding:14px 16px;
    border:1px solid var(--borde);border-radius:16px;background:var(--carta);
    margin-bottom:10px;color:inherit;text-decoration:none;transition:border-color .3s}
  a.cancion:hover{border-color:var(--borde2)}
  .disco{flex:0 0 auto;width:40px;height:40px;border-radius:50%;
    background:radial-gradient(circle, var(--lirio2) 0 18%, var(--carta2) 19% 24%,
      #1A1226 25% 100%);border:1px solid var(--borde2);position:relative}
  .disco::after{content:"";position:absolute;inset:6px;border-radius:50%;
    border:1px solid rgba(193,154,243,.18)}
  .cancion b{display:block;font-family:"Fraunces",Georgia,serif;font-weight:300;
    font-size:18px;line-height:1.25}
  .cancion span{display:block;font-size:13px;color:var(--tenue);margin-top:2px}
  .cancion .ir{margin-left:auto;color:var(--tenue2);font-family:"Space Mono",monospace;
    font-size:10px;letter-spacing:.14em;text-transform:uppercase}

  /* ---------- relojes ---------- */
  .ahora{border:1px solid var(--borde);border-radius:16px;background:var(--carta);
    padding:18px 16px;display:flex;align-items:center}
  .ahora .lado{flex:1;text-align:center}
  .ahora .lado b{display:block;font-family:"Space Mono",monospace;font-size:26px;
    font-weight:700;color:var(--texto);font-variant-numeric:tabular-nums;letter-spacing:.02em}
  .ahora .lado span{display:block;font-family:"Space Mono",monospace;font-size:9.5px;
    letter-spacing:.17em;text-transform:uppercase;color:var(--tenue2);margin-top:7px}
  .ahora .medio{flex:0 0 auto;padding:0 8px;color:var(--tenue2);
    font-family:"Fraunces",Georgia,serif;font-style:italic;font-size:13.5px;text-align:center;
    line-height:1.3;width:11ch}

  /* ---------- cierre ---------- */
  .cierre{margin-top:56px;text-align:center}
  .cierre .lirio{width:30px;height:30px;opacity:.7;margin-bottom:16px}
  .cierre p{font-family:"Fraunces",Georgia,serif;font-style:italic;font-weight:300;
    font-size:21px;color:var(--lirio);margin:0;line-height:1.5}

  @media (prefers-reduced-motion:reduce){
    *{transition:none!important;animation:none!important}
  }
</style>
</head>
<body>

<canvas id="cielo" aria-hidden="true"></canvas>

<div class="wrap">

  <header class="hero">
    <p class="fecha" id="fecha">&nbsp;</p>
    <svg class="lirio" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="rgba(193,154,243,.10)" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round">
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(60 50 50)"/>

        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(300 50 50)"/>
      </g>
      <g stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
        <line x1="50" y1="50" x2="50" y2="34"/>
        <line x1="50" y1="50" x2="63" y2="42"/>
        <line x1="50" y1="50" x2="37" y2="42"/>
        <line x1="50" y1="50" x2="63" y2="58"/>
        <line x1="50" y1="50" x2="37" y2="58"/>
        <line x1="50" y1="50" x2="50" y2="66"/>
      </g>
      <g fill="currentColor">
        <circle cx="50" cy="33" r="1.7"/><circle cx="64" cy="41" r="1.7"/><circle cx="36" cy="41" r="1.7"/>
        <circle cx="64" cy="59" r="1.7"/><circle cx="36" cy="59" r="1.7"/><circle cx="50" cy="67" r="1.7"/>

    </svg>
    <h1>Mientras llegas</h1>
    <p class="para">para Jessi</p>

    <div class="conteo">
      <div id="cifras">
        <div class="anillo">
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <circle class="pista" cx="50" cy="50" r="47"/>
            <circle class="avance" id="avance" cx="50" cy="50" r="47" pathLength="1"
                    stroke-dashoffset="1"/>
          </svg>
          <div class="centro"><b id="d">--</b><span>días</span></div>
        </div>
        <div class="finos">
          <div class="u"><b id="h">--</b><span>horas</span></div>
          <div class="u"><b id="m">--</b><span>min</span></div>
          <div class="u"><b id="s">--</b><span>seg</span></div>
        </div>
      </div>
      <p id="pie">para tenerte aquí</p>
    </div>
  </header>

  <div class="sep"><h2>Ábreme cuando…</h2></div>
  <div class="cartas" id="cartas"></div>

  <div class="sep"><h2>Nuestras canciones</h2></div>
  <div id="canciones"></div>

  <div class="sep"><h2>Ahora mismo</h2></div>
  <div class="ahora">
    <div class="lado"><b id="rSC">--:--</b><span>Santa Cruz</span></div>
    <div class="medio">una hora<br>de diferencia</div>
    <div class="lado"><b id="rBG">--:--</b><span>Bogotá</span></div>
  </div>

  <footer class="cierre">
    <svg class="lirio" viewBox="0 0 100 100" aria-hidden="true">
      <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round">
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(60 50 50)"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(120 50 50)"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(180 50 50)"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(240 50 50)"/>
        <path d="M50 50 C 41 36, 40 16, 50 4 C 60 16, 59 36, 50 50 Z" transform="rotate(300 50 50)"/>
      </g>
    </svg>
    <p>Nos vemos el 20 de diciembre.</p>

</div>

<script>
/* ==========================================================================
   AQUÍ SE EDITA TODO. No tienes que tocar nada más abajo.
   ========================================================================== */

/* 1) La fecha y hora exacta en que ella aterriza (hora de Colombia, -05:00).
      Cambia esto cuando sepas la hora real del vuelo.                        */
const LLEGADA = "2026-12-20T00:00:00-05:00";

/* 2) El día en que le mandaste la página. Sirve para que el anillo del
      contador se vaya llenando de aquí al 20 de diciembre.                   */
const INICIO = "2026-10-12T00:00:00-05:00";

/* 3) Lo que dice debajo del título, según la hora que sea en Santa Cruz.
      Cambia los textos como quieras.                                         */
const SALUDOS = {
  madrugada: "Es tarde allá. Si no puedes dormir, abre la segunda carta.",   // 00:00 – 05:59
  manana:    "Buenos días. Hoy falta un día menos que ayer.",                // 06:00 – 11:59
  mediodia:  "Antes de que entres a trabajar: te pienso.",                   // 12:00 – 13:59
  tarde:     "Sé que estás en el turno. Esto te espera cuando salgas.",      // 14:00 – 21:59
  noche:     "Ya saliste. Descansa, que yo sigo aquí."                       // 22:00 – 23:59
};

/* 4) Las cartas.
      "fecha": null  -> abierta desde ya.
      "fecha": "2026-10-25" -> con candado hasta ese día.
      Una carta con el texto vacío no aparece en la página.                   */
const CARTAS = [

  {
    cuando: "Cuando me extrañes",
    fecha: null,
    texto: [
      "No importa cuán lejos esté, no importa si pasan terremotos, diluvios o cualquier suceso que me haga estar más lejos de ti. Recuerda que siempre estaré en tu corazón, en tus pensamientos y en tus oraciones.",
      "Te amo. Quisiera que todo el mundo lo supiera: que eres mía y de nadie más, que te extraño, te pienso, te anhelo, te deseo, te quiero, te adoro, y que quiero que estés aquí conmigo.",
      "No se necesitan muchas cosas materiales para demostrarte que te amo. Cada acto que hago, cada pensamiento, cada detalle, cada día lluvioso, cada pareja que veo, cada cosa morada que veo, cada noche, cada nueve de la noche que te espero, me hacen pensar en ti. En conclusión: te extraño y te pienso todo el tiempo."
    ]
  },

  {
    cuando: "Cuando no puedas dormir",
    fecha: null,
    texto: [
      "Recuerda mi voz. Recuerda mis te amo, mis oraciones, mis historias, mis chismes, incluso nuestras discusiones. Todo. Y más que todo, recuerda mis audios. Si necesitas más, me dices jejeje.",
      "En estos momentos ten presente que, así como Dios está contigo, yo lo estoy igual. Te dejo un versículo hermoso como tú:"
    ],
    versiculo: "En paz me acostaré, y asimismo dormiré; porque solo tú, Jehová, me haces vivir confiado.",
    cita: "Salmos 4:8"
  },

  {
    cuando: "Cuando tengas un día horrible",
    fecha: null,
    texto: [
      "En estos momentos solo queda descansar en Dios y en mi pecho, mientras te abrazo y te acaricio. No tienes que hablar ni decir nada, solo sentir tranquilidad. Pero mientras no estamos juntitos, descansa en Dios y confía en Él como yo confío en ti.",
      "Y mientras estés sola, dímelo y te resuelvo: te doy de comer, te doy el mundo, te doy lo que soy, lo que nunca fui y lo que seré para ti. Simplemente seré todo tuyo."
    ]
  },

  /* ---- EJEMPLO DE CARTA CON CANDADO ----
     Escribe el texto y se abrirá sola ese día.
     Si la dejas vacía, no aparece en la página.                              */
  {
    cuando: "Cuando falte un mes",
    fecha: "2026-11-20",
    texto: [
      ""
    ]
  }

];

/* 5) Las canciones. Pega el link de YouTube o Spotify entre las comillas.
      Si dejas el link vacío, igual aparece el nombre, sin ser tocable.       */
const CANCIONES = [
  { titulo: "Risk It All",          artista: "Bruno Mars", link: "" },
  { titulo: "Nothing Else Matters", artista: "Metallica",  link: "" }
];

/* ==========================================================================
   De aquí para abajo no hay que tocar nada.
   ========================================================================== */
(function(){
  "use strict";

  var destino = new Date(LLEGADA).getTime();
  var inicio  = new Date(INICIO).getTime();
  var reduce  = false;
  try { reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches; } catch(e){}

  function dd(n){ return (n < 10 ? "0" : "") + n; }
  function $(id){ return document.getElementById(id); }
  function esc(t){
    return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  }

  /* ---------- cielo ---------- */
  (function cielo(){
    var c = $("cielo"); if (!c || !c.getContext) return;
    var ctx = c.getContext("2d");
    var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
    var estrellas = [];
    function medir(){
      W = window.innerWidth; H = window.innerHeight;
      c.width = W * dpr; c.height = H * dpr;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      estrellas = [];
      var n = Math.round((W * H) / 9000);
      for (var i = 0; i < n; i++){
        estrellas.push({
          x: Math.random() * W, y: Math.random() * H,
          r: 0.5 + Math.random() * 1.1,
          a: 0.25 + Math.random() * 0.55,
          v: 0.004 + Math.random() * 0.01,
          f: Math.random() * Math.PI * 2,
          g: Math.random() < 0.06
        });
      }
    }
    function pintar(t){
      ctx.clearRect(0, 0, W, H);
      for (var i = 0; i < estrellas.length; i++){
        var e = estrellas[i];
        var tw = reduce ? 1 : (0.65 + 0.35 * Math.sin(t * e.v + e.f));
        var al = e.a * tw;
        if (e.g){
          var gr = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, e.r * 6);
          gr.addColorStop(0, "rgba(220,200,255," + (al * 0.55) + ")");
          gr.addColorStop(1, "rgba(220,200,255,0)");
          ctx.fillStyle = gr;
          ctx.beginPath(); ctx.arc(e.x, e.y, e.r * 6, 0, Math.PI * 2); ctx.fill();
        }
        ctx.fillStyle = "rgba(241,234,249," + al + ")";
        ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
      }
    }
    var raf = null, t0 = 0;
    function loop(ts){
      if (!t0) t0 = ts;
      pintar((ts - t0) / 16);
      if (!reduce) raf = requestAnimationFrame(loop);
    }
    function arrancar(){ if (raf) cancelAnimationFrame(raf); t0 = 0; raf = requestAnimationFrame(loop); }
    medir(); arrancar();
    var rz = null;
    window.addEventListener("resize", function(){
      clearTimeout(rz); rz = setTimeout(function(){ medir(); arrancar(); }, 150);
    });
    document.addEventListener("visibilitychange", function(){
      if (document.hidden){ if (raf) cancelAnimationFrame(raf); raf = null; }
      else arrancar();
    });
  })();

  /* ---------- fecha y saludo ---------- */
  function partesSC(){
    try {
      var f = new Intl.DateTimeFormat("es", {
        timeZone: "America/La_Paz", weekday: "long", day: "numeric", month: "long",
        hour: "numeric", hour12: false
      }).formatToParts(new Date());
      var o = {};
      for (var i = 0; i < f.length; i++) o[f[i].type] = f[i].value;
      return o;
    } catch(e){ return null; }
  }
  (function(){
    var p = partesSC();
    if (p){
      var wd = p.weekday ? p.weekday.charAt(0).toUpperCase() + p.weekday.slice(1) : "";
      $("fecha").textContent = wd + " " + p.day + " de " + p.month;
      var h = parseInt(p.hour, 10); if (h === 24) h = 0;
      var s = SALUDOS.tarde;
      if (h < 6) s = SALUDOS.madrugada;
      else if (h < 12) s = SALUDOS.manana;
      else if (h < 14) s = SALUDOS.mediodia;
      else if (h < 22) s = SALUDOS.tarde;
      else s = SALUDOS.noche;
      if (s) $("saludo").textContent = s;
    }
  })();

  /* ---------- contador ---------- */
  var anilloListo = false;
  function tick(){
    var ahora = Date.now();
    var falta = destino - ahora;
    if (falta <= 0){
      $("cifras").innerHTML = '<p class="llego">Hoy.</p>';
      $("pie").textContent = "Ya no faltan días.";
      return false;
    }
    var seg = Math.floor(falta / 1000);
    var dias = Math.floor(seg / 86400);
    var hor  = Math.floor((seg % 86400) / 3600);
    var min  = Math.floor((seg % 3600) / 60);
    var sg   = seg % 60;
    $("d").textContent = dias;
    $("h").textContent = dd(hor);
    $("m").textContent = dd(min);
    $("s").textContent = dd(sg);
    $("pie").innerHTML = dias === 0
      ? "es hoy, en unas horas"
      : dias === 1 ? "mañana nos vemos"
      : 'faltan <em>' + dias + ' días</em> para tenerte aquí';

    var av = $("avance");
    if (av){
      var p = (ahora - inicio) / (destino - inicio);
      if (p < 0) p = 0; if (p > 1) p = 1;
      if (!anilloListo){
        anilloListo = true;
        setTimeout(function(){ av.setAttribute("stroke-dashoffset", String(1 - p)); }, 120);
      } else {
        av.setAttribute("stroke-dashoffset", String(1 - p));
      }
    }
    return true;
  }
  tick();
  var iv = setInterval(function(){ if (!tick()) clearInterval(iv); }, 1000);

  /* ---------- relojes ---------- */
  function hora(tz){
    try {
      return new Intl.DateTimeFormat("es-CO", {
        timeZone: tz, hour: "2-digit", minute: "2-digit", hour12: false
      }).format(new Date()).replace(/^24/, "00");
    } catch(e){ return "--:--"; }
  }
  function relojes(){
    $("rSC").textContent = hora("America/La_Paz");
    $("rBG").textContent = hora("America/Bogota");
  }
  relojes();
  setInterval(relojes, 15000);

  /* ---------- cartas ---------- */
  var SOBRE =
    '<svg class="sobre" viewBox="0 0 46 36" aria-hidden="true">' +
      '<rect class="cuerpoS" x="1" y="9" width="44" height="26" rx="4"/>' +
      '<path class="solapa" d="M1 12 L23 26 L45 12 L45 9 Q45 5 41 5 L5 5 Q1 5 1 9 Z"/>' +
      '<circle class="sello" cx="23" cy="20" r="3.2"/>' +
    '</svg>';
  var CANDADO =
    '<svg class="sobre" viewBox="0 0 46 36" aria-hidden="true">' +
      '<rect class="cuerpoS" x="1" y="9" width="44" height="26" rx="4"/>' +
      '<path class="solapa" d="M1 12 L23 26 L45 12 L45 9 Q45 5 41 5 L5 5 Q1 5 1 9 Z"/>' +
      '<rect class="sello" x="18" y="17" width="10" height="8" rx="1.5"/>' +
      '<path d="M20 17 v-2.5 a3 3 0 0 1 6 0 V17" fill="none" stroke="var(--tenue2)" stroke-width="1.3"/>' +
    '</svg>';

  var MESES = ["enero","febrero","marzo","abril","mayo","junio","julio",
               "agosto","septiembre","octubre","noviembre","diciembre"];

  function tieneTexto(c){
    if (!c.texto) return false;
    for (var i=0;i<c.texto.length;i++){
      if (String(c.texto[i]).trim() !== "") return true;
    }
    return false;
  }

  var cont = $("cartas");
  var html = "";
  var n = 0;

  for (var i = 0; i < CARTAS.length; i++){
    var c = CARTAS[i];
    if (!tieneTexto(c)) continue;

    var abierta = true, etiqueta = "";
    if (c.fecha){
      var f = new Date(c.fecha + "T00:00:00");
      abierta = Date.now() >= f.getTime();
      if (!abierta){
        etiqueta = '<span class="candado">' + f.getDate() + " " + MESES[f.getMonth()] + "</span>";
      }
    }

    var dentro = "";
    for (var j = 0; j < c.texto.length; j++){
      if (String(c.texto[j]).trim() === "") continue;
      dentro += "<p>" + esc(c.texto[j]) + "</p>";
    }
    if (c.versiculo){
      dentro += '<div class="versiculo"><q>' + esc(c.versiculo) + "</q>" +
                (c.cita ? "<cite>" + esc(c.cita) + "</cite>" : "") + "</div>";
    }

    var id = "c" + (n++);
    html += '<article class="carta' + (abierta ? "" : " cerrada") + '">' +
      '<button class="tapa" type="button"' +
        (abierta ? ' aria-expanded="false" aria-controls="' + id + '"' : ' disabled') + '>' +
        (abierta ? SOBRE : CANDADO) +
        '<span class="tt">' +
          (abierta ? "" : '<span class="k">se abre el</span>') +
          '<span class="q">' + esc(c.cuando) + "</span></span>" +
        (abierta ? '<span class="flecha" aria-hidden="true"></span>' : etiqueta) +
      "</button>" +
      (abierta
        ? '<div class="cuerpo" id="' + id + '"><div><div class="texto">' + dentro + "</div></div></div>"
        : "") +
      "</article>";
  }
  cont.innerHTML = html;

  cont.addEventListener("click", function(ev){
    var b = ev.target.closest ? ev.target.closest(".tapa") : null;
    if (!b || b.disabled) return;
    var art = b.parentNode;
    var ya = art.classList.contains("abierta");
    art.classList.toggle("abierta", !ya);
    b.setAttribute("aria-expanded", ya ? "false" : "true");
  });

  /* ---------- canciones ---------- */
  var hc = "";
  for (var k = 0; k < CANCIONES.length; k++){
    var s = CANCIONES[k];
    var ini = s.link ? '<a class="cancion" href="' + esc(s.link) + '" target="_blank" rel="noopener">'
                     : '<div class="cancion">';
    var fin = s.link ? '<span class="ir">escuchar</span></a>' : "</div>";
    hc += ini + '<span class="disco" aria-hidden="true"></span>' +
          "<span><b>" + esc(s.titulo) + "</b><span>" + esc(s.artista) + "</span></span>" + fin;
  }
  $("canciones").innerHTML = hc;

})();
</script>
</body>
</html>
